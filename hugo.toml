baseURL = 'https://leru-sama.github.io/'
languageCode = 'zh-cn'
title = '牛马日志'
theme = ['PaperMod']

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[params]
  defaultTheme = "auto"
  homeInfoParams = { Title = "你好，我是乐如 ", Content = "这里有一些我看的论文以及思考" }
  
  # 功能设置
  ShowCodeCopyButtons = true  # 启用文章复制按钮
  ShowReadingTime = true      # 添加阅读时间统计
  ShowPostNavLinks = true     # 实现文章导航链接
  ShowBreadCrumbs = true      # 添加面包屑导航
  ShowWordCounts = true       # 显示字数统计
  ShowLastMod = true          # 显示最后修改时间
  ShowToc = true              # 显示目录
  TocOpen = true              # 默认展开目录

