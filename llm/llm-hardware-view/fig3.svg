<svg viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" role="img">
<title>H100 的 Roofline 模型与三个 LLM 工作点</title>
<desc>对数坐标下的 Roofline 图，带宽屋脊为斜率 3.35 TB/s 的斜线，算力屋脊为 989 TFLOPS 的水平线，脊点位于算术强度 295。标注 decode batch 1、decode batch 256、prefill 三个工作点。</desc>
<text x="68" y="22" font-size="12" fill="#5F5E5A">性能（TFLOPS，对数）</text>
<text x="345" y="342" font-size="12" fill="#5F5E5A" text-anchor="middle">算术强度 I（FLOP/byte，对数）</text>
<path d="M70 30 L70 300 L620 300" fill="none" stroke="#C7C5BB" stroke-width="1"/>
<path d="M70 300 L69.6 299.8 L481.1 67.6 L481.1 300 Z" fill="#E6F1FB" opacity="0.55"/>
<path d="M69.6 299.8 L481.1 67.6" fill="none" stroke="#185FA5" stroke-width="2.5"/>
<path d="M481.1 67.6 L620 67.6" fill="none" stroke="#A32D2D" stroke-width="2.5"/>
<path d="M70 257.5 L141.5 257.5" fill="none" stroke="#C7C5BB" stroke-width="0.5" stroke-dasharray="3 3"/>
<path d="M70 222.4 L141.5 222.4" fill="none" stroke="#C7C5BB" stroke-width="0.5" stroke-dasharray="3 3"/>
<path d="M70 144.8 L141.5 144.8" fill="none" stroke="#C7C5BB" stroke-width="0.5" stroke-dasharray="3 3"/>
<path d="M70 67.2 L141.5 67.2" fill="none" stroke="#C7C5BB" stroke-width="0.5" stroke-dasharray="3 3"/>
<path d="M141.5 300 L141.5 303 M279 300 L279 303 M416.5 300 L416.5 303 M554 300 L554 303" fill="none" stroke="#8A8980" stroke-width="1"/>
<text x="141.5" y="316" font-size="11" fill="#8A8980" text-anchor="middle">1</text>
<text x="279" y="316" font-size="11" fill="#8A8980" text-anchor="middle">10</text>
<text x="416.5" y="316" font-size="11" fill="#8A8980" text-anchor="middle">100</text>
<text x="554" y="316" font-size="11" fill="#8A8980" text-anchor="middle">1000</text>
<text x="62" y="261" font-size="11" fill="#8A8980" text-anchor="end">1</text>
<text x="62" y="226" font-size="11" fill="#8A8980" text-anchor="end">10</text>
<text x="62" y="148" font-size="11" fill="#8A8980" text-anchor="end">100</text>
<text x="62" y="71" font-size="11" fill="#8A8980" text-anchor="end">1000</text>
<text x="200" y="255" font-size="12" fill="#185FA5">带宽受限区（I &lt; 295）</text>
<text x="500" y="58" font-size="12" fill="#A32D2D">算力受限区</text>
<circle cx="144.6" cy="257.5" r="5.5" fill="#D85A30" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="156" y="255" font-size="11.5" fill="#993C1D">decode, B=1</text>
<text x="156" y="270" font-size="10.5" fill="#8A8980">I=1.05 → 3.5 TFLOPS（0.36%）</text>
<circle cx="374.2" cy="128" r="5.5" fill="#1D9E75" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="330" y="112" font-size="11.5" fill="#0F6E56">decode, B=256, s=2K</text>
<text x="330" y="150" font-size="10.5" fill="#8A8980">I=49 → 165 TFLOPS（17%）</text>
<circle cx="597" cy="67.6" r="5.5" fill="#534AB7" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="500" y="92" font-size="11.5" fill="#3C3489">prefill, s=2048</text>
<text x="500" y="107" font-size="10.5" fill="#8A8980">I=2054 → 989 TFLOPS（打满）</text>
<circle cx="481.1" cy="67.6" r="4" fill="#FFFFFF" stroke="#185FA5" stroke-width="2"/>
<text x="490" y="40" font-size="11" fill="#185FA5">脊点 I_m = 295</text>
<text x="80" y="287" font-size="11" fill="#185FA5">带宽屋脊：P = 3.35 TB/s × I</text>
