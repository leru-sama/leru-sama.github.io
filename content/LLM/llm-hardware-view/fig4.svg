<svg viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg" role="img">
<title>decode 算术强度区间与硬件机器平衡点区间的对比</title>
<desc>对数坐标下，LLM decode 的算术强度落在 1.05 到 60 之间，而三代 GPU 的机器平衡点落在 153 到 591 之间，两个区间完全不重叠。</desc>
<text x="80" y="50" font-size="12" fill="#5F5E5A">LLM decode 的算术强度（B=1 → ∞，上下文 256 → 128K）</text>
<rect x="83.8" y="60" width="316" height="30" rx="4" fill="#D85A30" opacity="0.85"/>
<text x="95" y="80" font-size="12" fill="#FFFFFF">1.05</text>
<text x="360" y="80" font-size="12" fill="#FFFFFF">60</text>
<text x="80" y="110" font-size="12" fill="#5F5E5A">硬件机器平衡点（A100 BF16 → H100 FP8）</text>
<rect x="473" y="120" width="106" height="30" rx="4" fill="#185FA5" opacity="0.85"/>
<text x="485" y="140" font-size="12" fill="#FFFFFF">153</text>
<text x="545" y="140" font-size="12" fill="#FFFFFF">591</text>
<path d="M400 108 L400 168" fill="none" stroke="#A32D2D" stroke-width="1" stroke-dasharray="3 3"/>
<path d="M473 108 L473 168" fill="none" stroke="#A32D2D" stroke-width="1" stroke-dasharray="3 3"/>
<path d="M400 112 L473 112" fill="none" stroke="#A32D2D" stroke-width="1" marker-end="url(#m1)" marker-start="url(#m1)"/>
<text x="436" y="104" font-size="11" fill="#A32D2D" text-anchor="middle">从不重叠</text>
<path d="M80 175 L620 175" fill="none" stroke="#C7C5BB" stroke-width="1"/>
<path d="M80 175 L80 179 M260 175 L260 179 M440 175 L440 179 M620 175 L620 179" fill="none" stroke="#8A8980" stroke-width="1"/>
<text x="80" y="193" font-size="11" fill="#8A8980" text-anchor="middle">1</text>
<text x="260" y="193" font-size="11" fill="#8A8980" text-anchor="middle">10</text>
<text x="440" y="193" font-size="11" fill="#8A8980" text-anchor="middle">100</text>
<text x="620" y="193" font-size="11" fill="#8A8980" text-anchor="middle">1000</text>
<text x="350" y="215" font-size="12" fill="#5F5E5A" text-anchor="middle">算术强度（FLOP/byte，对数刻度）</text>
<defs>
<marker id="m1" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
<path d="M5 2 L5 8" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-linecap="round"/>
</marker>
</defs>
</svg>