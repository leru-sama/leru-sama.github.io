<rect x="290" y="195" width="175" height="36" rx="6" fill="#FFFFFF" stroke="#EF9F27" stroke-width="0.5"/>
<text x="377" y="213" font-size="13" fill="#412402" text-anchor="middle" dominant-baseline="central">FFN（SwiGLU）</text>
<path d="M467 213 L560 213 L560 263 L152 263" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar2)"/>
<circle cx="140" cy="263" r="9" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.5"/>
