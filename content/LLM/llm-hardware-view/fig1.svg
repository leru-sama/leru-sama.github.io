<path d="M467 105 L560 105 L560 155 L152 155" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar2)"/>
<circle cx="140" cy="155" r="9" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.5"/>
<path d="M135 155 L145 155 M140 150 L140 160" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="185" y="74" font-size="12" fill="#5F5E5A">① 注意力分支：沿序列方向混合信息</text>
<text x="185" y="142" font-size="12" fill="#5F5E5A">25M+17M 参数 · 84 MFLOP · 读写 KV cache</text>
