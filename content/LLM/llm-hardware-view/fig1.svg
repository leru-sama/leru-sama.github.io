<svg viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" role="img">
<title>残差流视角下的单层 Transformer</title>
<desc>主残差流垂直贯穿，注意力分支与 FFN 分支各自从残差流取值、经归一化后计算，再以加法写回残差流。</desc>
<defs>
