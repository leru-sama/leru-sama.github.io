<text x="366" y="126" font-size="9" fill="#185FA5" text-anchor="middle">PE</text>
<text x="306" y="236" font-size="10" fill="#0C447C" text-anchor="middle">MAC</text>
<text x="306" y="250" font-size="9" fill="#185FA5" text-anchor="middle">PE</text>
<text x="452" y="112" font-size="13" font-weight="500" fill="#0C447C">PE（处理单元）</text>
<text x="452" y="140" font-size="12" fill="#5F5E5A">每个 PE 包含：</text>
<text x="452" y="162" font-size="12" fill="#5F5E5A">· 1 个 bf16 乘法器</text>
<text x="452" y="182" font-size="12" fill="#5F5E5A">· 1 个加法器（累加）</text>
<text x="452" y="202" font-size="12" fill="#5F5E5A">· 少量局部寄存器</text>
<text x="452" y="222" font-size="12" fill="#5F5E5A">· 无全局广播，只与</text>
<text x="466" y="240" font-size="12" fill="#5F5E5A">相邻 PE 通信</text>
<text x="452" y="268" font-size="12" fill="#0F6E56">→ 走线短、扇出小</text>
<text x="452" y="288" font-size="12" fill="#0F6E56">→ 频率可做到接近</text>
<text x="466" y="306" font-size="12" fill="#0F6E56">标量 ALU 的极限</text>
<text x="186" y="344" font-size="11" fill="#5F5E5A" text-anchor="middle">部分和向下流出</text>
<text x="306" y="344" font-size="11" fill="#5F5E5A" text-anchor="middle">部分和向下流出</text>
