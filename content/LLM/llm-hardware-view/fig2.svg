<svg viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" role="img">
<title>4×4 脉动阵列的数据流</title>
<desc>激活值沿行向右流动，权重沿列向下流动，每个处理单元执行一次乘加并把部分和传给下方邻居。</desc>
<defs>
