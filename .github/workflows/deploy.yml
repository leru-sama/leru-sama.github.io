name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - master  # 注意：GitHub 默认分支现在是 main，如果你仍用 master 需要确保存在

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # peaceiris/actions-gh-pages 推送 gh-pages 分支需要

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true  # 拉取 themes/PaperMod 等 submodule

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3   # v2 基于 Node 16，已被 GitHub 平台弃用
        with:
          # PaperMod 主题要求 Hugo >= 0.146.0；固定版本避免 'latest' 拉到不兼容版本
          hugo-version: '0.147.4'
          extended: true

      - name: Build Hugo site
        run: hugo --minify

      - name: Deploy to GitHub Pages 🚀
        uses: peaceiris/actions-gh-pages@v4   # v3 基于 Node 16，已被 GitHub 平台弃用
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          # 可选：明确指定目标分支（默认已是 gh-pages）
          # destination_branch: gh-pages
