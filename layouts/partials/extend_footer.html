<script>
  // 实现目录跟随阅读进度功能 - 可折叠版本
  document.addEventListener('DOMContentLoaded', function() {
    // 获取目录元素
    const toc = document.querySelector('.floating-toc');
    if (!toc) return;

    // 创建切换按钮
    const toggleButton = document.createElement('button');
    toggleButton.className = 'toc-toggle';
    toggleButton.innerHTML = '📑';
    toggleButton.setAttribute('aria-label', 'Toggle table of contents');
    
    // 获取目录内容并保存
    const tocContent = toc.innerHTML;
    
    // 清空目录并添加切换按钮和内容容器
    toc.innerHTML = '';
    toc.appendChild(toggleButton);
    
    const contentContainer = document.createElement('div');
    contentContainer.className = 'toc-content';
    contentContainer.innerHTML = tocContent;
    toc.appendChild(contentContainer);

    // 获取所有标题元素和对应的目录链接
    const headings = document.querySelectorAll('h1[id], h2[id], h3[id], h4[id], h5[id], h6[id]');
    
    // 展开/折叠切换功能 - 改为鼠标悬停，添加动画状态控制
    let isAnimating = false;
    let mouseLeaveTimeout = null;

    toc.addEventListener('mouseenter', function() {
      // 清除任何待处理的离开事件
      if (mouseLeaveTimeout) {
        clearTimeout(mouseLeaveTimeout);
        mouseLeaveTimeout = null;
      }
      
      // 立即隐藏切换按钮的图标，在展开过程中不显示
      toggleButton.style.display = 'none';
      
      // 设置动画状态
      isAnimating = true;
      toc.classList.add('expanded');
      
      // 动态计算目录所需宽度
      setTimeout(() => {
        const tocContent = toc.querySelector('.toc-content');
        if (tocContent) {
          // 临时显示内容以测量宽度
          const originalDisplay = tocContent.style.display;
          tocContent.style.display = 'block';
          tocContent.style.visibility = 'hidden';
          
          // 计算所有链接的最大宽度
          const links = tocContent.querySelectorAll('a');
          let maxWidth = 0;
          links.forEach(link => {
            const linkWidth = link.scrollWidth;
            if (linkWidth > maxWidth) {
              maxWidth = linkWidth;
            }
          });
          
          // 设置目录宽度（考虑padding和边距）
          const padding = 32; // 左右padding总和
          const borderAndMargin = 20; // 边框和边距
          const calculatedWidth = Math.min(Math.max(maxWidth + padding + borderAndMargin, 300), 1000);
          
          toc.style.width = calculatedWidth + 'px';
          
          // 恢复显示状态
          tocContent.style.display = originalDisplay;
          tocContent.style.visibility = 'visible';
        }
      }, 50);
      
      // 动画完成后重置状态
      setTimeout(() => {
        isAnimating = false;
      }, 200); // 与CSS过渡时间匹配
    });

    toc.addEventListener('mouseleave', function() {
      // 如果正在动画中，延迟处理离开事件
      if (isAnimating) {
        mouseLeaveTimeout = setTimeout(() => {
          toc.classList.remove('expanded');
          // 重置宽度
          toc.style.width = '';
          // 收起时重新显示切换按钮
          toggleButton.style.display = 'flex';
          mouseLeaveTimeout = null;
        }, 250); // 稍微延迟以确保动画完成
      } else {
        toc.classList.remove('expanded');
        // 重置宽度
        toc.style.width = '';
        // 收起时重新显示切换按钮
        toggleButton.style.display = 'flex';
      }
    });

    // 滚动监听函数
    function updateActiveSection() {
      let currentSection = null;
      
      // 查找当前可见的章节 - 使用更精确的判断
      headings.forEach(heading => {
        const rect = heading.getBoundingClientRect();
        // 如果标题在视口中上部（顶部距离小于200px且底部在视口内），则认为它是当前可见章节
        if (rect.top <= 200 && rect.bottom >= 0) {
          currentSection = heading;
        }
      });

      // 移除所有目录项的高亮
      const tocLinks = document.querySelectorAll('.floating-toc a[href^="#"]');
      tocLinks.forEach(link => {
        link.classList.remove('toc-link-active');
      });

      // 仅在目录中高亮当前章节对应的目录项
      if (currentSection) {
        const id = currentSection.getAttribute('id');
        const activeLink = document.querySelector(`.floating-toc a[href="#${id}"]`);
        
        if (activeLink) {
          // 高亮目录项
          activeLink.classList.add('toc-link-active');
          
          // 如果目录已展开，自动滚动使当前高亮项可见
          if (toc.classList.contains('expanded')) {
            toc.scrollTop = activeLink.offsetTop - toc.offsetTop - 50;
            
            // 展开所有父级目录项
            let parent = activeLink.parentElement;
            while (parent && parent !== toc) {
              if (parent.tagName === 'LI' && parent.parentElement.tagName === 'UL') {
                parent.parentElement.style.display = 'block';
              }
              parent = parent.parentElement;
            }
          }
        }
      }
    }

    // 初始调用一次
    updateActiveSection();
    
    // 添加滚动监听
    window.addEventListener('scroll', function() {
      // 更新当前章节高亮
      updateActiveSection();
    });
    
    // 添加窗口大小改变监听
    window.addEventListener('resize', updateActiveSection);
  });
</script>

<style>
  /* 当前活动目录项样式 - 增强视觉效果 */
  .toc-link-active {
    color: var(--primary) !important;
    font-weight: bold;
    position: relative;
    background: linear-gradient(90deg, rgba(var(--primary-rgb, 65, 105, 225), 0.1), transparent) !important;
    border-left: 4px solid var(--primary) !important;
    padding-left: 12px !important;
    margin-left: -4px !important;
    border-radius: 0 4px 4px 0;
    box-shadow: 0 2px 4px rgba(var(--primary-rgb, 65, 105, 225), 0.2);
    transition: all 0.3s ease;
  }
  
  .toc-link-active::before {
    content: '▶';
    position: absolute;
    left: -8px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--primary);
    font-size: 10px;
    animation: pulse 2s infinite;
  }
  
  /* 脉冲动画 */
  @keyframes pulse {
    0%, 100% {
      opacity: 1;
      transform: translateY(-50%) scale(1);
    }
    50% {
      opacity: 0.7;
      transform: translateY(-50%) scale(1.1);
    }
  }
  
  /* 确保高亮效果在不同主题下都可见 */
  @media (prefers-color-scheme: dark) {
    .toc-link-active {
      background: linear-gradient(90deg, rgba(var(--primary-rgb, 100, 150, 255), 0.2), transparent) !important;
      box-shadow: 0 2px 6px rgba(var(--primary-rgb, 100, 150, 255), 0.3);
    }
  }
</style>
